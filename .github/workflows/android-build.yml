name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'directory-picker/**'
      - 'www/**'
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ===== 1. Checkout =====
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== 2. Verify Node.js is available =====
      - name: Check Node.js version
        run: |
          node --version || echo "Node.js not found"
          npm --version || echo "npm not found"

      # ===== 3. Install npm dependencies =====
      - name: Install npm dependencies
        run: npm install

      # ===== 4. Setup Java 17 =====
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ===== 5. Setup Android SDK =====
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      # ===== 6. Install Capacitor CLI globally =====
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5

      # ===== 7. Add Android platform =====
      - name: Add Android platform
        run: |
          # Remove any existing android directory to ensure clean build
          rm -rf android
          npx cap add android

      # ===== 8. Sync Capacitor =====
      - name: Sync Capacitor
        run: npx cap sync android

      # ===== 8b. Patch Android for directory picker =====
      - name: Patch Android for directory picker
        run: |
          chmod +x scripts/patch-android.sh
          ./scripts/patch-android.sh

      # ===== 8c. Register plugin in MainActivity =====
      - name: Register DirectoryPicker plugin
        run: |
          # Add import for DirectoryPickerPlugin to MainActivity.java
          sed -i '/import com.getcapacitor.Plugin;/a\    import com.gregzero.gomark.directorypicker.DirectoryPickerPlugin;' \
            android/app/src/main/java/com/gregzero/gomark/MainActivity.java
          # Add plugin registration
          sed -i '/this.init(savedInstanceState, new ArrayList<Class<? extends Plugin>>() {/a\        add(DirectoryPickerPlugin.class);' \
            android/app/src/main/java/com/gregzero/gomark/MainActivity.java

      # ===== 9. Build APK =====
      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      # ===== 10. Rename APK =====
      - name: Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found!"
            ls -la android/app/build/outputs/apk/debug/ || true
            exit 1
          fi
          cp "$APK_PATH" GoMark-app-debug-${{ github.run_number }}.apk

      # ===== 11. Upload artifact =====
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoMark-android-apk
          path: GoMark-app-debug-*.apk
          if-no-files-found: error
          retention-days: 30

      # ===== 12. Create Release (if tag) =====
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GoMark-app-debug-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
